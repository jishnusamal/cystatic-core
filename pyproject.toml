[project]
name = "cystatic"
version = "0.1.0"
description = "Cystatic API + analysis engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Jishnu Samal" }
]

dependencies = [
    "fastapi[all]>=0.135.2",
    "gunicorn>=25.3.0",
    "uvicorn>=0.42.0",
    "pygithub>=2.9.0",
    "python-dotenv>=1.2.2",
    "unidiff>=0.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0"
]
