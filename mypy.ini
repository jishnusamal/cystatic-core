[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
strict_equality = True
warn_redundant_casts = True
show_error_codes = True
show_traceback = True

# Ignore missing imports for third-party libraries
ignore_missing_imports = True

# Fix duplicate module issue with explicit package bases
explicit_package_bases = True
namespace_packages = True

# Suppress errors in language adapter extractors (AST parsing code)
[mypy-language_adapters.python.extractors.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
ignore_errors = True

[mypy-language_adapters.java.extractors.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
ignore_errors = True

# Suppress errors in GitHub integration (third-party library typing issues)
[mypy-integrations.github.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-runtime.github_auth]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-instrumentation.sentry.*]
disallow_untyped_defs = False
check_untyped_defs = False

# Exclude test files from strict checking
[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
